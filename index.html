<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ads Performance Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1117;
    color: #e4e4e7;
    min-height: 100vh;
  }

  .header {
    background: #16181d;
    border-bottom: 1px solid #2a2d35;
    padding: 20px 24px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }

  .header .meta {
    font-size: 13px;
    color: #71717a;
  }

  .controls {
    background: #16181d;
    border-bottom: 1px solid #2a2d35;
    padding: 16px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }

  .search-box {
    flex: 1;
    min-width: 250px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    background: #1e2028;
    border: 1px solid #2a2d35;
    border-radius: 8px;
    color: #e4e4e7;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box input:focus { border-color: #6366f1; }

  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
  }

  .filter-select {
    padding: 10px 14px;
    background: #1e2028;
    border: 1px solid #2a2d35;
    border-radius: 8px;
    color: #e4e4e7;
    font-size: 14px;
    outline: none;
    cursor: pointer;
    min-width: 180px;
  }

  .filter-select:focus { border-color: #6366f1; }

  .toggles {
    background: #16181d;
    border-bottom: 1px solid #2a2d35;
    padding: 12px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .toggle-btn {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid #2a2d35;
    background: #1e2028;
    color: #a1a1aa;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .toggle-btn.active {
    background: #6366f1;
    border-color: #6366f1;
    color: #fff;
  }

  .toggle-btn:hover { border-color: #6366f1; }

  .summary-bar {
    background: #1a1c23;
    padding: 14px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    border-bottom: 1px solid #2a2d35;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-label {
    font-size: 11px;
    color: #71717a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
  }

  .stat-value.green { color: #22c55e; }
  .stat-value.red { color: #ef4444; }

  .table-wrapper {
    overflow-x: auto;
    padding: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 900px;
  }

  thead {
    position: sticky;
    top: 0;
    z-index: 10;
  }

  th {
    background: #1a1c23;
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #a1a1aa;
    border-bottom: 2px solid #2a2d35;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    transition: color 0.2s;
  }

  th:hover { color: #6366f1; }
  th.sorted { color: #6366f1; }
  th .arrow { font-size: 10px; margin-left: 4px; }

  td {
    padding: 10px 12px;
    border-bottom: 1px solid #1e2028;
    white-space: nowrap;
  }

  tr:hover td { background: #1a1c23; }

  .text-right { text-align: right; }

  .col-account { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .col-client { max-width: 140px; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: #fff; }
  .col-campaign { max-width: 200px; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: #71717a; }
  .col-ad { max-width: 180px; overflow: hidden; text-overflow: ellipsis; }

  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    position: relative;
    top: -1px;
  }

  .status-active { background: #22c55e; box-shadow: 0 0 4px rgba(34, 197, 94, 0.5); }
  .status-paused { background: #ef4444; box-shadow: 0 0 4px rgba(239, 68, 68, 0.4); }
  .status-other { background: #52525b; }

  .badge-green {
    background: rgba(34, 197, 94, 0.15);
    color: #22c55e;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }

  .badge-red {
    background: rgba(239, 68, 68, 0.15);
    color: #ef4444;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }

  .badge-gray {
    color: #52525b;
    font-size: 11px;
  }

  .metric-count { color: #e4e4e7; font-weight: 600; }
  .metric-cost { color: #a1a1aa; font-size: 12px; }

  .loading {
    text-align: center;
    padding: 60px;
    color: #71717a;
    font-size: 16px;
  }

  .no-results {
    text-align: center;
    padding: 40px;
    color: #52525b;
    font-size: 14px;
  }

  .kpi-target {
    font-size: 10px;
    color: #52525b;
    font-weight: 400;
  }

  @media (max-width: 768px) {
    .controls { flex-direction: column; }
    .search-box { min-width: 100%; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📊 Ads Performance Dashboard</h1>
  <div class="meta" id="meta-info">Loading data...</div>
</div>

<div class="controls">
  <div class="search-box">
    <input type="text" id="search" placeholder="Search by ad, client, campaign, or account..." />
  </div>
  <select class="filter-select" id="account-filter">
    <option value="">All Accounts</option>
  </select>
</div>

<div class="toggles">
  <span style="font-size:12px;color:#71717a;margin-right:8px;line-height:32px;">Show:</span>
  <button class="toggle-btn active" data-group="leads">Leads</button>
  <button class="toggle-btn active" data-group="purchases">Booked Online</button>
  <button class="toggle-btn active" data-group="cr">Booked by Phone</button>
  <button class="toggle-btn active" data-group="schedules">Verbal Confirmed</button>
  <button class="toggle-btn active" data-group="arrivals">Arrivals</button>
</div>

<div class="summary-bar" id="summary-bar">
  <div class="stat">
    <span class="stat-label">Total Spend</span>
    <span class="stat-value" id="sum-spend">-</span>
  </div>
  <div class="stat">
    <span class="stat-label">Ads</span>
    <span class="stat-value" id="sum-ads">-</span>
  </div>
  <div class="stat">
    <span class="stat-label">Leads</span>
    <span class="stat-value" id="sum-leads">-</span>
  </div>
  <div class="stat">
    <span class="stat-label">Booked Online</span>
    <span class="stat-value" id="sum-purchases">-</span>
  </div>
  <div class="stat">
    <span class="stat-label">Arrivals</span>
    <span class="stat-value" id="sum-arrivals">-</span>
  </div>
  <div class="stat">
    <span class="stat-label">Blended $/Arrival</span>
    <span class="stat-value" id="sum-cpa">-</span>
  </div>
</div>

<div class="table-wrapper">
  <table>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="no-results" id="no-results" style="display:none;">No ads match your search.</div>
  <div class="loading" id="loading">Loading dashboard data...</div>
</div>

<script>
// State
let DATA = null;
let sortCol = "spend";
let sortDir = -1; // -1 = desc, 1 = asc
let visibleGroups = new Set(["leads", "purchases", "cr", "schedules", "arrivals"]);

// Column definitions
const COLUMNS = [
  { key: "account",   label: "Account",        group: null,        type: "text",   cls: "col-account" },
  { key: "client",    label: "Client",          group: null,        type: "text",   cls: "col-client" },
  { key: "campaign",  label: "Campaign",        group: null,        type: "text",   cls: "col-campaign" },
  { key: "ad",        label: "Ad",              group: null,        type: "text",   cls: "col-ad" },
  { key: "spend",     label: "Spend",           group: null,        type: "money",  cls: "text-right" },
  { key: "leads",     label: "Leads",           group: "leads",     type: "count",  cls: "text-right" },
  { key: "cpl",       label: "CPL",             group: "leads",     type: "cost",   cls: "text-right", target: 15 },
  { key: "purchases", label: "Booked Online",   group: "purchases", type: "count",  cls: "text-right" },
  { key: "cost_purchase", label: "$/Booking",   group: "purchases", type: "cost",   cls: "text-right" },
  { key: "complete_registrations", label: "Booked Phone", group: "cr", type: "count", cls: "text-right" },
  { key: "cost_cr",   label: "$/Phone Book",    group: "cr",        type: "cost",   cls: "text-right" },
  { key: "schedules", label: "Verbal Conf.",     group: "schedules", type: "count",  cls: "text-right" },
  { key: "cost_schedule", label: "$/Verbal",    group: "schedules", type: "cost",   cls: "text-right" },
  { key: "arrivals",  label: "Arrivals",         group: "arrivals",  type: "count",  cls: "text-right" },
  { key: "cost_arrival", label: "$/Arrival",    group: "arrivals",  type: "arrival", cls: "text-right", target: 80 },
];

function getVisibleColumns() {
  return COLUMNS.filter(c => c.group === null || visibleGroups.has(c.group));
}

function formatMoney(v) {
  if (v == null) return '<span class="badge-gray">—</span>';
  return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatCount(v) {
  if (v === 0) return '<span class="badge-gray">0</span>';
  return `<span class="metric-count">${v}</span>`;
}

function formatCost(v) {
  if (v == null) return '<span class="badge-gray">—</span>';
  return `<span class="metric-cost">${formatMoney(v)}</span>`;
}

function formatArrival(v, arrivals) {
  if (arrivals === 0 || v == null) return '<span class="badge-gray">—</span>';
  if (v <= 80) return `<span class="badge-green">${formatMoney(v)}</span>`;
  return `<span class="badge-red">${formatMoney(v)}</span>`;
}

function statusDot(status) {
  if (!status || status === "UNKNOWN") return "";
  if (status === "ACTIVE") return '<span class="status-dot status-active" title="Active"></span>';
  if (status === "PAUSED" || status === "CAMPAIGN_PAUSED" || status === "ADSET_PAUSED")
    return '<span class="status-dot status-paused" title="Paused"></span>';
  return '<span class="status-dot status-other" title="' + status + '"></span>';
}

function renderCell(col, row) {
  const v = row[col.key];
  switch (col.type) {
    case "text":
      if (col.key === "campaign") return statusDot(row.campaign_status) + (v || "");
      if (col.key === "ad") return statusDot(row.ad_status) + (v || "");
      return v || "";
    case "money": return formatMoney(v);
    case "count": return formatCount(v);
    case "cost": return formatCost(v);
    case "arrival": return formatArrival(v, row.arrivals);
    default: return v;
  }
}

function getFilteredData() {
  if (!DATA) return [];
  const search = document.getElementById("search").value.toLowerCase();
  const account = document.getElementById("account-filter").value;

  return DATA.ads.filter(ad => {
    if (account && ad.account !== account) return false;
    if (search) {
      const haystack = `${ad.account} ${ad.client} ${ad.campaign} ${ad.ad}`.toLowerCase();
      return haystack.includes(search);
    }
    return true;
  });
}

function getSortedData(ads) {
  return [...ads].sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (av == null) av = sortDir === -1 ? -Infinity : Infinity;
    if (bv == null) bv = sortDir === -1 ? -Infinity : Infinity;
    if (typeof av === "string") return sortDir * av.localeCompare(bv);
    return sortDir * (av - bv);
  });
}

function renderHeader() {
  const cols = getVisibleColumns();
  const thead = document.getElementById("thead");
  thead.innerHTML = "<tr>" + cols.map(col => {
    const sorted = col.key === sortCol;
    const arrow = sorted ? (sortDir === 1 ? " ▲" : " ▼") : "";
    const targetHint = col.target ? ` <span class="kpi-target">(≤$${col.target})</span>` : "";
    return `<th class="${col.cls} ${sorted ? 'sorted' : ''}" data-col="${col.key}">
      ${col.label}${targetHint}<span class="arrow">${arrow}</span>
    </th>`;
  }).join("") + "</tr>";
}

function renderTable() {
  const filtered = getFilteredData();
  const sorted = getSortedData(filtered);
  const cols = getVisibleColumns();

  renderHeader();
  updateSummary(filtered);

  const tbody = document.getElementById("tbody");
  const noResults = document.getElementById("no-results");
  const loading = document.getElementById("loading");

  loading.style.display = "none";

  if (sorted.length === 0) {
    tbody.innerHTML = "";
    noResults.style.display = "block";
    return;
  }

  noResults.style.display = "none";

  tbody.innerHTML = sorted.map(row => {
    return "<tr>" + cols.map(col => {
      return `<td class="${col.cls}">${renderCell(col, row)}</td>`;
    }).join("") + "</tr>";
  }).join("");
}

function updateSummary(ads) {
  const totalSpend = ads.reduce((s, a) => s + a.spend, 0);
  const totalLeads = ads.reduce((s, a) => s + a.leads, 0);
  const totalPurchases = ads.reduce((s, a) => s + a.purchases, 0);
  const totalArrivals = ads.reduce((s, a) => s + a.arrivals, 0);
  const blendedCPA = totalArrivals > 0 ? totalSpend / totalArrivals : null;

  document.getElementById("sum-spend").textContent = formatMoney(totalSpend).replace(/<[^>]*>/g, "");
  document.getElementById("sum-ads").textContent = ads.length.toLocaleString();
  document.getElementById("sum-leads").textContent = totalLeads.toLocaleString();
  document.getElementById("sum-purchases").textContent = totalPurchases.toLocaleString();
  document.getElementById("sum-arrivals").textContent = totalArrivals.toLocaleString();

  const cpaEl = document.getElementById("sum-cpa");
  if (blendedCPA != null) {
    cpaEl.textContent = "$" + blendedCPA.toFixed(2);
    cpaEl.className = "stat-value " + (blendedCPA <= 80 ? "green" : "red");
  } else {
    cpaEl.textContent = "—";
    cpaEl.className = "stat-value";
  }
}

function populateAccountFilter() {
  const accounts = [...new Set(DATA.ads.map(a => a.account))].sort();
  const select = document.getElementById("account-filter");
  accounts.forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    select.appendChild(opt);
  });
}

// Event listeners
document.getElementById("search").addEventListener("input", renderTable);
document.getElementById("account-filter").addEventListener("change", renderTable);

document.getElementById("thead").addEventListener("click", e => {
  const th = e.target.closest("th");
  if (!th) return;
  const col = th.dataset.col;
  if (col === sortCol) {
    sortDir *= -1;
  } else {
    sortCol = col;
    sortDir = -1;
  }
  renderTable();
});

document.querySelectorAll(".toggle-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const group = btn.dataset.group;
    if (visibleGroups.has(group)) {
      visibleGroups.delete(group);
      btn.classList.remove("active");
    } else {
      visibleGroups.add(group);
      btn.classList.add("active");
    }
    renderTable();
  });
});

// Load data
fetch("data.json")
  .then(r => r.json())
  .then(data => {
    DATA = data;
    document.getElementById("meta-info").textContent =
      `Last updated: ${new Date(data.updated).toLocaleString()} · Date range: ${data.date_range.since} to ${data.date_range.until} · ${data.total_ads} ads`;
    populateAccountFilter();
    renderTable();
  })
  .catch(err => {
    document.getElementById("loading").textContent = "⚠️ Failed to load data.json. Run pull_data.py first.";
    console.error(err);
  });
</script>
</body>
</html>
